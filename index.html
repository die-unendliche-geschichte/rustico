<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rustico Suche</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.4/styles/ag-grid.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.4/styles/ag-theme-alpine.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }

    #header {
      height: 40px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 16px;
      background: #1a2635;
      color: #fff;
      flex-shrink: 0;
    }
    #header h1 { font-size: .95em; font-weight: 600; letter-spacing: .03em; }
    #count { margin-left: auto; font-size: .8em; color: #99aabc; }

    #app { display: flex; height: calc(100vh - 40px); }

    #table-pane {
      display: flex;
      flex-direction: column;
      width: 58%;
      min-width: 380px;
    }
    #grid { flex: 1; }

    #divider {
      width: 5px;
      cursor: col-resize;
      background: #d0d0d0;
      flex-shrink: 0;
      transition: background .15s;
    }
    #divider:hover, #divider.dragging { background: #888; }

    #map-pane { flex: 1; min-width: 0; position: relative; }
    #map { height: 100%; }

    /* ── Filter bar ─────────────────────────────────────────────────── */
    #filter-bar {
      padding: 5px 8px;
      background: #f0f3f7;
      border-bottom: 1px solid #ccc;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
      font-size: .78em;
    }
    .fb-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .fb-label { font-weight: 600; color: #555; min-width: 62px; }

    .fb-chip {
      padding: 2px 9px;
      border-radius: 10px;
      border: 1px solid #b0b8c4;
      background: #fff;
      cursor: pointer;
      font-size: inherit;
      color: #333;
      line-height: 1.6;
    }
    .fb-chip:hover { background: #e8ecf1; }
    .fb-chip.on { background: #1a2635; color: #fff; border-color: #1a2635; }

    /* Gemeinde dropdown */
    #gemeinde-picker { position: relative; }
    #gemeinde-btn {
      padding: 2px 9px;
      border-radius: 10px;
      border: 1px solid #b0b8c4;
      background: #fff;
      cursor: pointer;
      font-size: inherit;
      color: #333;
      line-height: 1.6;
    }
    #gemeinde-btn.on { background: #1a2635; color: #fff; border-color: #1a2635; }
    #gemeinde-panel {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 1000;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
      width: 220px;
      max-height: 300px;
      flex-direction: column;
    }
    #gemeinde-panel.open { display: flex; }
    #gemeinde-search {
      padding: 6px 10px;
      border: none;
      border-bottom: 1px solid #ddd;
      font-size: .9em;
      outline: none;
    }
    #gemeinde-list { overflow-y: auto; flex: 1; padding: 4px 0; }
    .gem-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 3px 10px;
      cursor: pointer;
      font-size: .9em;
      white-space: nowrap;
      user-select: none;
    }
    .gem-item:hover { background: #f0f3f7; }

    /* ── View toggle buttons ────────────────────────────────────────── */
    /* "Karte →" button sitting right of the filter bar */
    #btn-show-map {
      margin-left: auto;
      padding: 3px 10px;
      border-radius: 10px;
      border: 1px solid #b0b8c4;
      background: #fff;
      cursor: pointer;
      font-size: inherit;
      color: #333;
      white-space: nowrap;
    }
    #btn-show-map:hover { background: #e8ecf1; }

    /* "← Tabelle" floating button on the map */
    #btn-show-table {
      display: none;
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      padding: 6px 12px;
      border-radius: 4px;
      border: 2px solid rgba(0,0,0,.2);
      background: #fff;
      cursor: pointer;
      font-size: .82em;
      font-weight: 600;
      color: #333;
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }
    #btn-show-table:hover { background: #f4f4f4; }

    /* ── Map popup ──────────────────────────────────────────────────── */
    .prop-popup { width: 210px; }
    .prop-popup img {
      width: 100%; border-radius: 4px; display: block; margin-bottom: 6px;
    }
    .prop-popup .pop-title { font-weight: 600; font-size: .88em; line-height: 1.3; }
    .prop-popup .pop-price { color: #555; font-size: .82em; margin: 3px 0 5px; }
    .prop-popup a { font-size: .82em; }
  </style>
</head>
<body>

<div id="header">
  <h1>Rustico Suche</h1>
  <span id="count"></span>
</div>

<div id="app">
  <div id="table-pane">
    <div id="filter-bar">
      <div class="fb-row">
        <span class="fb-label">Bezirk</span>
        <div id="bezirk-chips" style="display:flex;gap:4px;flex-wrap:wrap;"></div>
      </div>
      <div class="fb-row">
        <span class="fb-label">Gemeinde</span>
        <div id="gemeinde-picker">
          <button id="gemeinde-btn">Alle ▾</button>
          <div id="gemeinde-panel">
            <input type="search" id="gemeinde-search" placeholder="Suchen…">
            <div id="gemeinde-list"></div>
          </div>
        </div>
        <button id="btn-show-map">Karte →</button>
      </div>
    </div>
    <div id="grid" class="ag-theme-alpine"></div>
  </div>
  <div id="divider"></div>
  <div id="map-pane">
    <div id="map"></div>
    <button id="btn-show-table">← Tabelle</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.4/dist/ag-grid-community.min.noStyle.js"></script>
<script src="data/plz.js"></script>
<script src="data/properties.js"></script>

<script>
'use strict';

// ── Helpers ───────────────────────────────────────────────────────────────────

function titleFromLink(link) {
  const slug = (link ?? '').split('/').pop().split('?')[0];
  return slug.replace(/[-_]\d{5,}$/, '').replace(/[-_]+/g, ' ').trim();
}

function fmtCHF(v) {
  return v != null ? 'CHF\u202f' + Math.round(v / 1000) + 'k' : '';
}

// ── View toggle (table ↔ map) ─────────────────────────────────────────────────

const tablePane    = document.getElementById('table-pane');
const mapPane      = document.getElementById('map-pane');
const divider      = document.getElementById('divider');
const btnShowMap   = document.getElementById('btn-show-map');
const btnShowTable = document.getElementById('btn-show-table');

btnShowMap.addEventListener('click', () => {
  tablePane.style.display = 'none';
  divider.style.display   = 'none';
  btnShowTable.style.display = 'block';
  setTimeout(() => map.invalidateSize(), 10);
});

btnShowTable.addEventListener('click', () => {
  tablePane.style.display = '';
  divider.style.display   = '';
  btnShowTable.style.display = 'none';
});

// ── Resizable divider ─────────────────────────────────────────────────────────

(function () {
  let dragging = false, startX = 0, startW = 0;

  divider.addEventListener('mousedown', e => {
    dragging = true;
    startX = e.clientX;
    startW = tablePane.getBoundingClientRect().width;
    divider.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const newW = Math.max(200, startW + e.clientX - startX);
    tablePane.style.width = newW + 'px';
    tablePane.style.flex  = 'none';
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    divider.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    map.invalidateSize();
  });
})();

// ── Map ───────────────────────────────────────────────────────────────────────

const swAttr = '© <a href="https://www.swisstopo.admin.ch">swisstopo</a>';
const swUrl  = (layer, ext = 'jpeg') =>
  `https://wmts.geo.admin.ch/1.0.0/${layer}/default/current/3857/{z}/{x}/{y}.${ext}`;

const map = L.map('map').setView([46.25, 8.85], 9);

const baseLayers = {
  'Swisstopo Grey':   L.tileLayer(swUrl('ch.swisstopo.pixelkarte-grau'),  { attribution: swAttr }),
  'Swisstopo Colour': L.tileLayer(swUrl('ch.swisstopo.pixelkarte-farbe'), { attribution: swAttr }),
  'Aerial':           L.tileLayer(swUrl('ch.swisstopo.swissimage'),        { attribution: swAttr }),
  'OpenStreetMap':    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                        { attribution: '© <a href="https://osm.org/copyright">OpenStreetMap</a>' }),
};
baseLayers['Swisstopo Grey'].addTo(map);

const plzLayer = L.geoJSON(PLZ_GEOJSON, {
  style: { color: '#555', weight: 1, fillColor: '#aaa', fillOpacity: 0.4 },
  onEachFeature(feature, layer) {
    layer.bindTooltip(feature.properties.postal_code);
    layer.on('mouseover', () => layer.setStyle({ weight: 3, color: '#000', fillOpacity: 0.6 }));
    layer.on('mouseout',  () => plzLayer.resetStyle(layer));
  },
});

L.control.layers(baseLayers, { PLZ: plzLayer }, { collapsed: false }).addTo(map);

const cluster    = L.markerClusterGroup({ maxClusterRadius: 40 });
const markerById = new Map();

PROPERTIES.forEach(p => {
  if (p.lat == null || p.lon == null) return;

  const slug  = (p.property_link ?? '').split('/').pop().split('?')[0];
  const title = titleFromLink(p.property_link);
  const price = p.price_chf != null ? fmtCHF(p.price_chf) : '';

  const popup = `<div class="prop-popup">
<img src="images/${slug}.jpg" onerror="this.style.display='none'">
<div class="pop-title">${title}</div>
${price ? `<div class="pop-price">${price}</div>` : ''}
<a href="${p.property_link}" target="_blank">Inserat öffnen →</a>
</div>`;

  const m = L.circleMarker([p.lat, p.lon], {
    radius: 9, color: '#333', weight: 2, fillColor: '#e05c1a', fillOpacity: 0.9,
  }).bindPopup(popup, { maxWidth: 230 });

  markerById.set(p.id, m);
  cluster.addLayer(m);
});

map.addLayer(cluster);

function syncMapToIds(visibleIds) {
  cluster.clearLayers();
  for (const [id, m] of markerById) {
    if (visibleIds.has(id)) cluster.addLayer(m);
  }
}

// ── External filters (Bezirk / Gemeinde) ─────────────────────────────────────

const selBezirke   = new Set();
const selGemeinden = new Set();

const BEZIRKE   = [...new Set(PROPERTIES.map(p => p.bezirk).filter(Boolean))].sort();
const GEMEINDEN = [...new Set(PROPERTIES.map(p => p.gemeinde).filter(Boolean))].sort();

// Bezirk chips
BEZIRKE.forEach(b => {
  const btn = document.createElement('button');
  btn.className = 'fb-chip';
  btn.textContent = b;
  btn.addEventListener('click', () => {
    if (selBezirke.has(b)) selBezirke.delete(b);
    else selBezirke.add(b);
    btn.classList.toggle('on', selBezirke.has(b));
    gridApi.onFilterChanged();
  });
  document.getElementById('bezirk-chips').appendChild(btn);
});

// Gemeinde searchable dropdown
const gemBtn    = document.getElementById('gemeinde-btn');
const gemPanel  = document.getElementById('gemeinde-panel');
const gemSearch = document.getElementById('gemeinde-search');
const gemList   = document.getElementById('gemeinde-list');

function buildGemList(query = '') {
  const q = query.toLowerCase();
  gemList.innerHTML = '';
  GEMEINDEN.filter(g => g.toLowerCase().includes(q)).forEach(g => {
    const lbl = document.createElement('label');
    lbl.className = 'gem-item';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = selGemeinden.has(g);
    cb.addEventListener('change', () => {
      if (cb.checked) selGemeinden.add(g);
      else selGemeinden.delete(g);
      updateGemBtn();
      gridApi.onFilterChanged();
    });
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode(g));
    gemList.appendChild(lbl);
  });
}

function updateGemBtn() {
  if (selGemeinden.size === 0) {
    gemBtn.textContent = 'Alle ▾';
    gemBtn.classList.remove('on');
  } else {
    gemBtn.textContent = `${selGemeinden.size} ausgewählt ▾`;
    gemBtn.classList.add('on');
  }
}

gemBtn.addEventListener('click', e => {
  e.stopPropagation();
  gemPanel.classList.toggle('open');
  if (gemPanel.classList.contains('open')) {
    buildGemList(gemSearch.value);
    gemSearch.focus();
  }
});

gemSearch.addEventListener('input', () => buildGemList(gemSearch.value));

document.addEventListener('click', e => {
  if (!document.getElementById('gemeinde-picker').contains(e.target)) {
    gemPanel.classList.remove('open');
  }
});

// ── Grid ─────────────────────────────────────────────────────────────────────

const TITLE_MAX = 60;

const colDefs = [
  {
    headerName: 'Inserat',
    valueGetter:  p => titleFromLink(p.data.property_link),
    cellRenderer: p => {
      const t = p.value.length > TITLE_MAX ? p.value.slice(0, TITLE_MAX) + '…' : p.value;
      return `<a href="${p.data.property_link}" target="_blank"
          style="font-size:.82em;line-height:1.4;">${t}</a>`;
    },
    filter: 'agTextColumnFilter',
    flex: 1,
    minWidth: 160,
  },
  {
    field: 'price_chf', headerName: 'Preis', width: 95, filter: 'agNumberColumnFilter',
    valueFormatter: p => fmtCHF(p.value),
    sort: 'asc',
  },
  {
    headerName: 'Ort',
    valueGetter: p => [p.data.postal_code, p.data.city].filter(Boolean).join(' '),
    filter: 'agTextColumnFilter',
    width: 160,
  },
  { field: 'living_area_m2', headerName: 'Wohn m²',  width: 88,  filter: 'agNumberColumnFilter' },
  { field: 'plot_area_m2',   headerName: 'Grund m²', width: 88,  filter: 'agNumberColumnFilter' },
  { field: 'gemeinde', headerName: 'Gemeinde', width: 130, floatingFilter: false },
  { field: 'bezirk',   headerName: 'Bezirk',   width: 130, floatingFilter: false },
];

// ── Grid init ─────────────────────────────────────────────────────────────────

const countEl = document.getElementById('count');

const gridApi = agGrid.createGrid(document.getElementById('grid'), {
  columnDefs: colDefs,
  rowData: PROPERTIES,
  defaultColDef: {
    sortable:       true,
    resizable:      true,
    floatingFilter: true,
  },
  rowHeight:             50,
  headerHeight:          36,
  floatingFiltersHeight: 32,
  suppressCellFocus:     true,
  isExternalFilterPresent() {
    return selBezirke.size > 0 || selGemeinden.size > 0;
  },
  doesExternalFilterPass(node) {
    const { gemeinde, bezirk } = node.data;
    if (selBezirke.size > 0   && !selBezirke.has(bezirk))     return false;
    if (selGemeinden.size > 0 && !selGemeinden.has(gemeinde)) return false;
    return true;
  },
  getRowStyle(p) {
    if (p.data.blacklist_keywords)   return { background: '#fff0f0' };
    if (p.data.interesting_keywords) return { background: '#f0faf0' };
  },
  onFilterChanged(e) {
    const ids = new Set();
    e.api.forEachNodeAfterFilter(n => ids.add(n.data.id));
    syncMapToIds(ids);
    countEl.textContent = `${e.api.getDisplayedRowCount()} / ${PROPERTIES.length}`;
  },
  onGridReady(e) {
    e.api.sizeColumnsToFit();
    countEl.textContent = `${PROPERTIES.length} Inserate`;
  },
  onRowClicked(e) {
    const m = markerById.get(e.data.id);
    if (!m) return;
    map.setView(m.getLatLng(), 13, { animate: true });
    m.openPopup();
  },
});
</script>
</body>
</html>
